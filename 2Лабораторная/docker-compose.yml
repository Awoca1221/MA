name: ma2lab

services:
  service1:
    build:
      context: ./service1
  
  service2:
    build:
      context: ./service2
  
  nginx:
    image: nginx:1.31-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - service1
      - service2
